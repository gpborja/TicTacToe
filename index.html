<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root{--bg:#14213d;--panel:#1d2d50;--cell:#22365e;--cell-hover:#2b4473;--txt:#f5f5f5;--muted:#a9b4c8;--x:#ff6b6b;--o:#4ecdc4;--accent:#ffd166;--win:#ffd16633}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--bg)}
  h1{margin:0 0 16px;font-size:36px;letter-spacing:4px}
  h1 .x{color:var(--x)}h1 .o{color:var(--o)}
  .controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px}
  label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
  select,button{font:inherit;font-size:15px;color:var(--txt);background:var(--panel);border:2px solid #3a4f7a;border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover,select:hover{border-color:var(--accent)}
  button:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .scores{display:flex;gap:12px;margin-bottom:16px}
  .score{background:var(--panel);border-radius:10px;padding:8px 16px;text-align:center;min-width:90px;border:2px solid transparent}
  .score.active{border-color:var(--accent)}
  .score .name{font-size:13px;color:var(--muted)}
  .score .val{font-size:26px;font-weight:700}
  #scoreX .val{color:var(--x)}#scoreO .val{color:var(--o)}
  #status{min-height:28px;font-size:20px;margin-bottom:16px;text-align:center}
  #board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(360px,90vw);aspect-ratio:1}
  .cell{background:var(--cell);border:none;border-radius:12px;font-size:clamp(48px,16vw,80px);font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
  .cell[aria-disabled="false"]:hover{background:var(--cell-hover)}
  .cell[aria-disabled="true"]{cursor:default}
  .cell.X{color:var(--x)}.cell.O{color:var(--o)}
  .cell.win{background:var(--win);box-shadow:inset 0 0 0 3px var(--accent)}
  .cell.placed{animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
  .actions{display:flex;gap:12px;margin-top:20px}
  .hint{margin-top:16px;font-size:13px;color:var(--muted);text-align:center;max-width:360px}
</style>
</head>
<body>
<h1>TIC <span class="x">TAC</span> <span class="o">TOE</span></h1>

<div class="controls">
  <label>Mode
    <select id="mode">
      <option value="ai">vs Computer</option>
      <option value="pvp">2 Players</option>
    </select>
  </label>
  <label id="diffWrap">Difficulty
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard" selected>Unbeatable</option>
    </select>
  </label>
  <label id="firstWrap">You play
    <select id="human">
      <option value="X">X (first)</option>
      <option value="O">O (second)</option>
    </select>
  </label>
</div>

<div class="scores">
  <div class="score" id="scoreX"><div class="name" id="nameX">You (X)</div><div class="val">0</div></div>
  <div class="score" id="scoreD"><div class="name">Draws</div><div class="val">0</div></div>
  <div class="score" id="scoreO"><div class="name" id="nameO">Computer (O)</div><div class="val">0</div></div>
</div>

<div id="status" role="status" aria-live="polite"></div>
<div id="board" role="grid" aria-label="Tic Tac Toe board"></div>

<div class="actions">
  <button id="newGame">New game</button>
  <button id="resetScores">Reset scores</button>
</div>
<p class="hint">Click a square or use the arrow keys and Enter. Press N for a new game.</p>

<script>
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const STORE='tictactoe.v1';
const $=id=>document.getElementById(id);
const boardEl=$('board'),statusEl=$('status');

const state={board:Array(9).fill(null),turn:'X',over:false,starter:'X',
  scores:{X:0,O:0,D:0},mode:'ai',difficulty:'hard',human:'X'};

function load(){
  try{const s=JSON.parse(localStorage.getItem(STORE));if(s){
    if(s.scores)Object.assign(state.scores,s.scores);
    if(['ai','pvp'].includes(s.mode))state.mode=s.mode;
    if(['easy','medium','hard'].includes(s.difficulty))state.difficulty=s.difficulty;
    if(['X','O'].includes(s.human))state.human=s.human;}}catch(e){}
}
function save(){
  try{localStorage.setItem(STORE,JSON.stringify({scores:state.scores,mode:state.mode,difficulty:state.difficulty,human:state.human}))}catch(e){}
}

function winner(b){
  for(const l of LINES){const[a,c,d]=l;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return{player:b[a],line:l};}
  return b.every(Boolean)?{player:null,line:[]}:null;
}
const empties=b=>b.reduce((a,v,i)=>(v?a:a.concat(i)),[]);
const other=p=>p==='X'?'O':'X';

function minimax(b,player,me,depth){
  const w=winner(b);
  if(w)return{score:w.player===me?10-depth:w.player?depth-10:0};
  let best={score:player===me?-Infinity:Infinity,move:null};
  for(const i of empties(b)){
    b[i]=player;const r=minimax(b,other(player),me,depth+1);b[i]=null;
    if(player===me?r.score>best.score:r.score<best.score)best={score:r.score,move:i};
  }
  return best;
}
function aiMove(){
  const b=state.board,me=state.turn,free=empties(b);
  const rand=()=>free[Math.floor(Math.random()*free.length)];
  if(state.difficulty==='easy')return rand();
  if(state.difficulty==='medium'&&Math.random()<0.4)return rand();
  if(free.length===9)return [0,2,4,6,8][Math.floor(Math.random()*5)];
  return minimax(b.slice(),me,me,0).move;
}

function isAITurn(){return state.mode==='ai'&&!state.over&&state.turn!==state.human}
function label(p){
  if(state.mode==='pvp')return `Player ${p}`;
  return p===state.human?'You':'Computer';
}

function play(i){
  if(state.over||state.board[i])return;
  state.board[i]=state.turn;
  const w=winner(state.board);
  if(w){state.over=true;state.scores[w.player||'D']++;save();state.result=w;}
  else state.turn=other(state.turn);
  render(i);
  if(isAITurn())setTimeout(()=>{if(isAITurn())play(aiMove())},350);
}

// In 2-player mode the starting player alternates between rounds; vs the computer X always starts.
function newGame(nextRound){
  state.board=Array(9).fill(null);state.over=false;state.result=null;
  state.starter=state.mode==='pvp'&&nextRound?other(state.starter):'X';
  state.turn=state.starter;
  render();
  if(isAITurn())setTimeout(()=>{if(isAITurn())play(aiMove())},350);
}

function render(placed){
  const cells=boardEl.children;
  state.board.forEach((v,i)=>{
    const c=cells[i];c.textContent=v||'';c.className='cell'+(v?' '+v:'')+(i===placed?' placed':'');
    c.setAttribute('aria-disabled',String(!!v||state.over||isAITurn()));
    c.setAttribute('aria-label',`Row ${Math.floor(i/3)+1}, column ${i%3+1}: ${v||'empty'}`);
  });
  if(state.result){
    state.result.line.forEach(i=>cells[i].classList.add('win'));
    const p=state.result.player;
    statusEl.textContent=!p?"It's a draw!":state.mode==='pvp'?`Player ${p} wins!`:p===state.human?'You win!':'Computer wins!';
  }else{
    statusEl.textContent=state.mode==='pvp'?`Player ${state.turn}'s turn`:
      state.turn===state.human?`Your turn (${state.turn})`:'Computer is thinking…';
  }
  $('nameX').textContent=`${label('X')} (X)`;$('nameO').textContent=`${label('O')} (O)`;
  $('scoreX').querySelector('.val').textContent=state.scores.X;
  $('scoreO').querySelector('.val').textContent=state.scores.O;
  $('scoreD').querySelector('.val').textContent=state.scores.D;
  $('scoreX').classList.toggle('active',!state.over&&state.turn==='X');
  $('scoreO').classList.toggle('active',!state.over&&state.turn==='O');
  $('diffWrap').hidden=$('firstWrap').hidden=state.mode!=='ai';
}

for(let i=0;i<9;i++){
  const c=document.createElement('button');c.className='cell';c.dataset.i=i;c.setAttribute('role','gridcell');
  c.addEventListener('click',()=>{if(!isAITurn())play(i)});boardEl.appendChild(c);
}
boardEl.addEventListener('keydown',e=>{
  const i=+e.target.dataset.i;if(isNaN(i))return;
  const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[e.key];
  if(d===undefined)return;
  e.preventDefault();
  const n=i+d;
  if(n<0||n>8||(Math.abs(d)===1&&Math.floor(n/3)!==Math.floor(i/3)))return;
  boardEl.children[n].focus();
});
document.addEventListener('keydown',e=>{
  if((e.key==='n'||e.key==='N')&&!['SELECT','INPUT'].includes(e.target.tagName))newGame(true);
});

$('mode').addEventListener('change',e=>{state.mode=e.target.value;state.scores={X:0,O:0,D:0};save();newGame()});
$('difficulty').addEventListener('change',e=>{state.difficulty=e.target.value;save();});
$('human').addEventListener('change',e=>{state.human=e.target.value;state.scores={X:0,O:0,D:0};save();newGame()});
$('newGame').addEventListener('click',()=>newGame(true));
$('resetScores').addEventListener('click',()=>{state.scores={X:0,O:0,D:0};save();render()});

load();
$('mode').value=state.mode;$('difficulty').value=state.difficulty;$('human').value=state.human;
newGame();
</script>
</body>
</html>
